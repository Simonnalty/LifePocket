/* ========= 原子组件 ========= */
const C = { paper: '#FFFFFF', ink: '#1D1D1F', gray: '#8A8F9B', hair: '#ECEEF1', blue: '#3478F6', yellow: '#F6C21B' };
const chkBox = (done) => ({
  width: 22, height: 22, borderRadius: 7, border: done ? 'none' : '2px solid #C9CDD4',
  background: done ? C.blue : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
});
function Chk({ done, onToggle }) {
  return <div style={{ ...chkBox(done), cursor: 'pointer' }} onClick={onToggle}>
    {done && <svg width="13" height="10" viewBox="0 0 13 10"><path d="M1 5.2L4.6 8.6L12 1.4" stroke="#fff" strokeWidth="2.4" fill="none" strokeLinecap="round"/></svg>}
  </div>;
}

/* ========= 屏幕：明细 ========= */

          <span onClick={() => onView('stats')} style={{ padding: '4px 12px', borderRadius: 6, cursor: 'pointer', background: view === 'stats' ? '#fff' : 'transparent', boxShadow: view === 'stats' ? '0 1px 3px rgba(0,0,0,.1)' : 'none', fontWeight: view === 'stats' ? 700 : 400, color: view === 'stats' ? C.ink : C.gray }}>统计</span>

      <div style={{ display: 'flex', gap: 16, marginTop: 14, fontSize: 13 }}>
        <span style={{ color: C.gray }}>支出 <b style={{ color: C.ink, fontSize: 15 }}>¥3,284.60</b></span>

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginTop: 18 }}>
          <span style={{ fontSize: 26, fontWeight: 800, color: C.gray }}>¥</span>
          <span style={{ fontSize: 44, fontWeight: 800, letterSpacing: 1 }}>28.50</span>
          <span style={{ fontSize: 13, color: C.gray, marginLeft: 'auto' }}>今天 · 11月19日</span>
        </div>
        <div style={{ fontSize: 12.5, color: C.gray, marginTop: 16, marginBottom: 8 }}>大类</div>

/* ========= 屏幕：统计 ========= */

/* ========= 屏幕：任务 ========= */
function TaskScreen() {
  const [tasks, setTasks] = useState(TASKS0);
  const toggle = (gi, ii) => setTasks(tasks.map((g, i) => i !== gi ? g : { ...g, items: g.items.map((it, j) => j !== ii ? it : { ...it, done: !it.done }) }));
  return (
    <div style={{ height: '100%', background: C.paper, padding: '22px 20px 76px', overflow: 'auto' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: 26, fontWeight: 900 }}>任务</span>
        <span style={{ fontSize: 17, color: '#B4B9C2' }}>⚙</span>
      </div>
      {tasks.map((g, gi) => {
        const done = g.items.filter((x) => x.done).length;
        return (
          <div key={gi} style={{ marginTop: gi === 0 ? 16 : 22, background: '#fff', borderRadius: 16, boxShadow: '0 2px 6px rgba(0,0,0,.05), 0 20px 44px rgba(29,29,31,.08)', padding: '16px 18px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <span style={{ fontSize: 17.5, fontWeight: 800 }}>{g.name}</span>
              <span style={{ fontSize: 12.5, color: C.gray }}>{done} / {g.items.length} 项</span>
            </div>
            <div style={{ marginTop: 10, height: 5, background: '#F1F2F4', borderRadius: 3 }}>
              <div style={{ width: (done / g.items.length) * 100 + '%', height: '100%', background: C.blue, borderRadius: 3 }} />
            </div>
            <div style={{ marginTop: 8 }}>
              {g.items.map((it, ii) => (
                <div key={ii}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 0' }}>
                    <Chk done={it.done} onToggle={() => toggle(gi, ii)} />
                    <span style={{ fontSize: 14.5, color: it.done ? C.gray : C.ink, textDecoration: it.done ? 'line-through' : 'none' }}>{it.t}</span>
                  </div>
                  <div style={{ height: 1, background: C.hair, marginLeft: 34 }} />
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '12px 0 2px', color: C.gray, fontSize: 13.5, cursor: 'pointer' }}>
              <span style={{ color: C.blue, fontWeight: 700 }}>＋</span> 添加子项
            </div>
          </div>
        );
      })}
      <div style={{ position: 'absolute', right: 20, bottom: 74, width: 56, height: 56, borderRadius: '50%', background: C.blue, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 30, cursor: 'pointer', boxShadow: '0 10px 24px rgba(52,120,246,.4)' }}>＋</div>
    </div>
  );
}

  );

/* ========= 底部导航 ========= */
function TabBar({ tab, setTab }) {
  const tabs = [['detail', '明细'], ['tasks', '任务'], ['film', '胶片']];
  return (
    <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: 62, background: 'rgba(255,255,255,.94)', borderTop: `1px solid ${C.hair}`, display: 'flex' }}>
      {tabs.map(([k, label]) => (
        <div key={k} onClick={() => setTab(k)} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, cursor: 'pointer', color: (tab === k || (k === 'detail' && tab === 'stats')) ? C.blue : C.gray, fontWeight: (tab === k || (k === 'detail' && tab === 'stats')) ? 800 : 400, fontSize: 12.5 }}>
          <span style={{ fontSize: 17 }}>{k === 'detail' ? '≡' : k === 'tasks' ? '☑' : '🎞'}</span>{label}
        </div>
      ))}
    </div>
  );
}

/* ========= 单台手机 ========= */
function Phone({ initial = 'detail', withSheet = false }) {
  const [tab, setTab] = useState(initial);
  const [sheet, setSheet] = useState(withSheet);
  return (
    <AndroidFrame>
      {tab === 'detail' && <DetailScreen view={tab} onView={setTab} onAdd={() => setSheet(true)} />}
      {tab === 'stats' && <StatsScreen onView={setTab} />}
      {tab === 'tasks' && <TaskScreen />}
      {tab === 'film' && <FilmScreen />}
      {sheet && <AddSheet onClose={() => setSheet(false)} />}
      {!sheet && <TabBar tab={tab} setTab={setTab} />}
    </AndroidFrame>
  );
}
